<div class="container mt-5 pt-5">
  <div class="row">
    <div class="col-lg-5 col-md-8 mx-auto">
      <div class="card fade-in-up">
        <div class="card-header text-center">
          <h3 class="mb-0 text-white">Welcome Back! 👋</h3>
        </div>
        <div class="card-body p-5">
          <div *ngIf="successMessage" class="alert alert-success">
            {{ successMessage }}
          </div>
          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>
          
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-4">
              <label class="form-label fw-semibold">Email Address</label>
              <input type="email" formControlName="email" class="form-control"
                     placeholder="Enter your email"
                     [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              <div class="invalid-feedback">Valid email is required</div>
            </div>
            
            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" formControlName="password" class="form-control"
                     placeholder="Enter your password"
                     [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              <div class="invalid-feedback">Password is required</div>
            </div>
            
            <div class="mb-4 form-check">
              <input type="checkbox" formControlName="rememberMe" class="form-check-input">
              <label class="form-check-label">Remember me</label>
            </div>
            
            <button type="submit" class="btn btn-gradient w-100 py-3 rounded-pill fw-semibold" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ loading ? 'Signing in...' : 'Sign In' }}
            </button>
            
            <div class="text-center mt-4">
              <a routerLink="/account/forgot-password" class="text-decoration-none">Forgot Password?</a>
              <span class="mx-2 text-muted">|</span>
              <a routerLink="/account/register" class="text-decoration-none">Create Account</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
