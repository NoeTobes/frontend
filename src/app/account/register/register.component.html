<div class="container mt-4 pt-4">
  <div class="row">
    <div class="col-lg-6 col-md-8 mx-auto">
      <div class="card fade-in-up">
        <div class="card-header text-center">
          <h3 class="mb-0 text-white">Create Account ✨</h3>
        </div>
        <div class="card-body p-5">
          <div *ngIf="successMessage" class="alert alert-success">
            {{ successMessage }}
          </div>
          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>
          
          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Title</label>
                <select formControlName="title" class="form-select">
                  <option value="Mr">Mr</option>
                  <option value="Mrs">Mrs</option>
                  <option value="Miss">Miss</option>
                  <option value="Ms">Ms</option>
                  <option value="Dr">Dr</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">First Name</label>
                <input type="text" formControlName="firstName" class="form-control" placeholder="First name">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-semibold">Last Name</label>
                <input type="text" formControlName="lastName" class="form-control" placeholder="Last name">
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-semibold">Email Address</label>
              <input type="email" formControlName="email" class="form-control" placeholder="Enter your email">
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" formControlName="password" class="form-control" placeholder="Min 6 characters">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Confirm Password</label>
                <input type="password" formControlName="confirmPassword" class="form-control" placeholder="Confirm password">
              </div>
            </div>
            
            <div class="mb-4 form-check">
              <input type="checkbox" formControlName="acceptTerms" class="form-check-input">
              <label class="form-check-label">I accept the Terms and Conditions</label>
            </div>
            
            <button type="submit" class="btn btn-gradient w-100 py-3 rounded-pill fw-semibold" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ loading ? 'Creating Account...' : 'Create Account' }}
            </button>
            
            <div class="text-center mt-4">
              Already have an account? <a routerLink="/account/login" class="text-decoration-none fw-semibold">Sign In</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
