<div class="container mt-4">
  <div class="row">
    <div class="col-md-8 mx-auto">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">{{ isEditMode ? 'Edit User' : 'Add New User' }}</h4>
        </div>
        <div class="card-body">
          <div *ngIf="loading" class="text-center py-5">
            <div class="spinner-border text-primary"></div>
          </div>
          
          <form *ngIf="!loading" [formGroup]="userForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Title</label>
                <select formControlName="title" class="form-select">
                  <option value="Mr">Mr</option>
                  <option value="Mrs">Mrs</option>
                  <option value="Miss">Miss</option>
                  <option value="Ms">Ms</option>
                  <option value="Dr">Dr</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" formControlName="firstName" class="form-control">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" formControlName="lastName" class="form-control">
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" formControlName="email" class="form-control">
            </div>
            
            <div class="mb-3" *ngIf="!isEditMode">
              <label class="form-label">Password</label>
              <input type="password" formControlName="password" class="form-control">
              <small class="text-muted">Minimum 6 characters</small>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Role</label>
                <select formControlName="role" class="form-select">
                  <option value="User">User</option>
                  <option value="Admin">Admin</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email Verified</label>
                <select formControlName="isVerified" class="form-select">
                  <option [value]="true">Yes</option>
                  <option [value]="false">No</option>
                </select>
              </div>
            </div>
            
            <div class="d-flex justify-content-between">
              <button type="button" class="btn btn-secondary" routerLink="/admin/users">Cancel</button>
              <button type="submit" class="btn btn-primary" [disabled]="loading">
                {{ loading ? 'Saving...' : (isEditMode ? 'Update User' : 'Create User') }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
