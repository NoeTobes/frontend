<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="gradient-text">Activity Logs</h1>
    <button class="btn btn-primary" (click)="refresh()">
      <i class="fas fa-sync-alt me-2"></i>Refresh
    </button>
  </div>
  
  <!-- Filters -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-5">
          <input type="text" class="form-control" placeholder="Search by email, action, or details..." 
                 #searchInput (input)="searchTerm = searchInput.value; filterLogs()">
        </div>
        <div class="col-md-3">
          <select class="form-select" #actionSelect (change)="selectedAction = actionSelect.value; filterLogs()">
            <option value="">All Actions</option>
            <option *ngFor="let action of actions" [value]="action">{{ action }}</option>
          </select>
        </div>
        <div class="col-md-2">
          <span class="badge bg-info fs-6 p-2">Total: {{ total }} logs</span>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Logs Table -->
  <div class="card">
    <div class="card-body">
      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Loading logs...</p>
      </div>
      
      <div class="table-responsive" *ngIf="!loading">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>Time</th>
              <th>User</th>
              <th>Action</th>
              <th>Details</th>
              <th>IP Address</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let log of filteredLogs">
              <td style="min-width: 180px;">{{ formatDate(log.created_at) }}</td>
              <td><strong>{{ log.user_email }}</strong></td>
              <td><span class="badge" [class]="getActionBadgeClass(log.action)">{{ log.action }}</span></td>
              <td>{{ log.details }}</td>
              <td><code>{{ log.ip_address }}</code></td>
            </tr>
            <tr *ngIf="filteredLogs.length === 0">
              <td colspan="5" class="text-center py-5">
                <i class="fas fa-history fa-3x text-muted mb-3"></i>
                <p>No activity logs found</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
