<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="gradient-text">User Management</h1>
    <a routerLink="/admin/users/add" class="btn btn-gradient">
      <i class="fas fa-plus me-2"></i>Add New User
    </a>
  </div>
  
  <!-- Filters -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Search by name or email..." 
                 [(ngModel)]="searchTerm">
        </div>
        <div class="col-md-3">
          <select class="form-select" [(ngModel)]="filterRole">
            <option value="">All Roles</option>
            <option value="Admin">Admin</option>
            <option value="User">User</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-secondary w-100" (click)="loadUsers()">
            <i class="fas fa-sync-alt me-2"></i>Refresh
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Users Table -->
  <div class="card">
    <div class="card-body">
      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-2">Loading users...</p>
      </div>
      
      <div *ngIf="!loading && filteredUsers.length === 0" class="text-center py-5">
        <i class="fas fa-users fa-3x text-muted mb-3"></i>
        <p>No users found</p>
      </div>
      
      <div class="table-responsive" *ngIf="!loading && filteredUsers.length > 0">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Verified</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of filteredUsers; let i = index">
              <td>{{ i + 1 }}</td>
              <td>
                <strong>{{ user.firstName }} {{ user.lastName }}</strong>
                <small class="d-block text-muted">{{ user.title }}</small>
              </td>
              <td>{{ user.email }}</td>
              <td>
                <button class="btn btn-sm" 
                        [class.btn-primary]="user.role === 'Admin'"
                        [class.btn-secondary]="user.role === 'User'"
                        (click)="toggleRole(user)">
                  {{ user.role }}
                </button>
              </td>
              <td>
                <span *ngIf="user.isVerified" class="badge bg-success">
                  <i class="fas fa-check-circle"></i> Verified
                </span>
                <span *ngIf="!user.isVerified" class="badge bg-warning">
                  <i class="fas fa-clock"></i> Pending
                </span>
              </td>
              <td>{{ user.createdAt | date:'mediumDate' }}</td>
              <td>
                <a [routerLink]="['/admin/users/edit', user.id]" class="btn btn-sm btn-info me-1">
                  <i class="fas fa-edit"></i>
                </a>
                <button class="btn btn-sm btn-danger" (click)="deleteUser(user)">
                  <i class="fas fa-trash"></i>
                </button>
                <button *ngIf="!user.isVerified" class="btn btn-sm btn-success ms-1" (click)="verifyUser(user)">
                  <i class="fas fa-check"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
